name: Test and Release
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -B -m unittest discover -s tests
      - run: python goldticker.py --smoke-test
  build-macos:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt 'pyinstaller>=6.11,<7'
      - run: python tools/build.py
      - run: dist/macos/GoldTicker.app/Contents/MacOS/GoldTicker --smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal2
          path: |
            dist/**/*.dmg
            dist/**/*.sha256
  build-windows-winui:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.404'
      - name: Package WinUI + Core
        shell: pwsh
        run: |
          .\tools\package_winui.ps1 *> package-winui.log
          if (-not $?) {
            Get-Content package-winui.log -Tail 120
            exit 1
          }
          Get-Content package-winui.log -Tail 40
      - name: Smoke Core IPC
        shell: pwsh
        run: |
          $core = "dist\windows-winui\GoldTicker\GoldTicker.Core.exe"
          if (-not (Test-Path $core)) { throw "missing $core" }
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = (Resolve-Path $core)
          $psi.RedirectStandardInput = $true
          $psi.RedirectStandardOutput = $true
          $psi.UseShellExecute = $false
          $psi.CreateNoWindow = $true
          $p = [Diagnostics.Process]::Start($psi)
          $p.StandardInput.WriteLine('{"id":1,"method":"hello"}')
          $p.StandardInput.WriteLine('{"id":2,"method":"quit"}')
          $p.StandardInput.Close()
          $out = $p.StandardOutput.ReadToEnd()
          if (-not $p.WaitForExit(15000)) { $p.Kill(); throw "core hang" }
          Write-Host $out
          if ($out -notmatch '"ok"\s*:\s*true') { throw "core hello failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-winui-x64
          path: |
            dist/windows-winui/GoldTicker-WinUI-Windows-x64.zip
            dist/windows-winui/GoldTicker-WinUI-Windows-x64.zip.sha256
            package-winui.log
  publish-draft-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-macos, build-windows-winui]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/**/*.dmg
            release-assets/**/*.zip
            release-assets/**/*.sha256
