name: Test and Release
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -B -m unittest discover -s tests
      - run: python goldticker.py --smoke-test
  build-macos:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/build.py
      - run: lipo -info dist/macos/GoldTicker.app/Contents/MacOS/GoldTicker
      - run: dist/macos/GoldTicker.app/Contents/MacOS/GoldTicker --smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal2
          path: |
            dist/macos/GoldTicker-macOS-Universal2.dmg
            dist/macos/GoldTicker-macOS-Universal2.dmg.sha256
  build-windows:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Build standalone WPF GoldTicker.exe
        shell: pwsh
        run: .\tools\build_windows_wpf.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            dist/windows/GoldTicker.exe
            dist/windows/GoldTicker.exe.sha256
            dist/windows/GoldTicker-Windows-x64.zip
            dist/windows/GoldTicker-Windows-x64.zip.sha256
  publish-draft-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/**/*.dmg
            release-assets/**/*.exe
            release-assets/**/*.zip
            release-assets/**/*.sha256
