name: Windows Single EXE Build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'windows-wpf/**'
      - 'tools/build_windows_wpf.ps1'
      - '.github/workflows/winui-package.yml'
permissions:
  contents: write
concurrency:
  group: win-single-exe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Build standalone GoldTicker.exe
        shell: pwsh
        run: |
          .\tools\build_windows_wpf.ps1 *> build-windows-wpf.log
          if (-not $?) {
            Get-Content build-windows-wpf.log -Tail 120
            exit 1
          }
          Get-Content build-windows-wpf.log -Tail 50
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-single-exe
          path: |
            dist/windows/GoldTicker.exe
            dist/windows/GoldTicker.exe.sha256
            dist/windows/GoldTicker-Windows-x64.zip
            build-windows-wpf.log
          if-no-files-found: ignore
      - name: Publish drop branch
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          DROP_DIR=$(mktemp -d)
          if [ -f dist/windows/GoldTicker.exe ]; then
            cp dist/windows/GoldTicker.exe "$DROP_DIR/"
            cp dist/windows/GoldTicker.exe.sha256 "$DROP_DIR/" || true
            cp dist/windows/GoldTicker-Windows-x64.zip "$DROP_DIR/" || true
          fi
          if [ -f build-windows-wpf.log ]; then cp build-windows-wpf.log "$DROP_DIR/"; fi
          cd "$DROP_DIR"
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "windows single exe drop"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/winui-drop"
