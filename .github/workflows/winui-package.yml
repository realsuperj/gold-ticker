name: WinUI Package
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'winui/**'
      - 'core/**'
      - 'core_worker.py'
      - 'GoldTicker.Core.spec'
      - 'tools/package_winui.ps1'
      - '.github/workflows/winui-package.yml'
permissions:
  contents: write
concurrency:
  group: winui-package-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@v4
        with:
          # Pin 8.x — runners may also have SDK 10, which breaks WindowsAppSDK PriGen tasks.
          dotnet-version: '8.0.404'
      - name: Use .NET 8 SDK
        shell: pwsh
        run: |
          dotnet --list-sdks
          dotnet --version
          # Prefer the 8.x SDK even if a newer one is installed.
          New-Item -ItemType Directory -Force -Path winui\GoldTicker.WinUI | Out-Null

      - name: Package WinUI + Core
        id: package
        shell: pwsh
        run: |
          # Avoid piping so $ErrorActionPreference / throw keep a real exit code.
          .\tools\package_winui.ps1 *> package-winui.log
          if (-not $?) {
            Get-Content package-winui.log -Tail 120
            exit 1
          }
          Get-Content package-winui.log -Tail 40

      - name: Upload package log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winui-package-log
          path: package-winui.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: windows-winui-x64
          path: |
            dist/windows-winui/GoldTicker-WinUI-Windows-x64.zip
            dist/windows-winui/GoldTicker-WinUI-Windows-x64.zip.sha256
      # Drop branch: zip on success, log on failure (fetchable over git SSH)
      - name: Publish drop branch
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          DROP_DIR=$(mktemp -d)
          mkdir -p "$DROP_DIR"
          if [ -f dist/windows-winui/GoldTicker-WinUI-Windows-x64.zip ]; then
            cp dist/windows-winui/GoldTicker-WinUI-Windows-x64.zip "$DROP_DIR/"
            cp dist/windows-winui/GoldTicker-WinUI-Windows-x64.zip.sha256 "$DROP_DIR/" || true
          fi
          if [ -f package-winui.log ]; then cp package-winui.log "$DROP_DIR/"; fi
          ls -la "$DROP_DIR"
          test -n "$(ls -A "$DROP_DIR")"
          cd "$DROP_DIR"
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "winui package drop"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/winui-drop"